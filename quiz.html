  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 20px;

      font-family: Arial, sans-serif; background: #101525; color: white;
    }
    .quiz-container {
      width: 100%; max-width: 650px; padding: 28px;
      border-radius: 20px; background: #1a2238; box-shadow: 0 10px 35px #0005;
    }
    h1 { margin: 0 0 8px; text-align: center; color: #45e6ff; }
    .subtitle { margin: 0 0 22px; text-align: center; color: #b9c4df; }
    .home-button {
      display: inline-block; margin-bottom: 18px; padding: 10px 14px;
      border-radius: 8px; background: #303b58; color: white; text-decoration: none;
    }
    .meta { display: flex; justify-content: space-between; gap: 12px; color: #ffe66d; font-weight: bold; }
    .progress-track { height: 8px; margin: 16px 0 24px; overflow: hidden; border-radius: 10px; background: #303b58; }
    .progress-bar { width: 0; height: 100%; background: #45e6ff; transition: width .25s; }
    #question { font-size: 21px; line-height: 1.5; }
    #category { color: #45e6ff; font-size: 13px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    .options { display: grid; gap: 12px; margin: 22px 0; }
    .option {
      width: 100%; padding: 15px; border: 2px solid #34415f; border-radius: 10px;
      background: #101525; color: white; text-align: left; font-size: 16px; cursor: pointer;
    }
    .option:hover:not(:disabled) { border-color: #45e6ff; }
    .option:disabled { cursor: default; }
    .option.correct { background: #174b3b; border-color: #45e6a0; }
    .option.wrong { background: #572b3b; border-color: #ff6f85; }
    #feedback { min-height: 24px; line-height: 1.5; font-weight: bold; }
    .main-button {
      width: 100%; padding: 14px; border: 0; border-radius: 10px;
      background: #45e6ff; color: #101525; font-size: 16px; font-weight: bold; cursor: pointer;
    }
    .main-button:disabled { opacity: .55; cursor: not-allowed; }
    .hidden { display: none !important; }
    #result { text-align: center; }
    #final-score { margin: 22px 0; color: #ffe66d; font-size: 42px; font-weight: bold; }
    .note { margin: 20px 0 0; color: #b9c4df; text-align: center; font-size: 13px; line-height: 1.5; }
    button:focus-visible, a:focus-visible { outline: 3px solid white; outline-offset: 3px; }
    @media (max-width: 450px) { .quiz-container { padding: 20px; } #question { font-size: 19px; } }
  </style>
</head>

    const ROUND_SIZE = 10;

    let currentQuestion = 0;
    let totalScore = 0;
    let answered = false;

    const questionCount = document.getElementById("question-count");
    const scoreText = document.getElementById("score");
    const questionText = document.getElementById("question");
    const categoryText = document.getElementById("category");
    const optionsContainer = document.getElementById("options");
    const feedback = document.getElementById("feedback");
    const nextButton = document.getElementById("next-button");
    const progressBar = document.getElementById("progress-bar");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result");

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function startRound() {
      if (!Array.isArray(QUESTION_BANK) || QUESTION_BANK.length < ROUND_SIZE) {
        questionText.textContent = "Question bank could not be loaded.";
        feedback.textContent = "Please make sure you are using the complete quiz.html file.";
        nextButton.disabled = true;
        return;
      }
      roundQuestions = shuffle(QUESTION_BANK).slice(0, ROUND_SIZE).map(q => {
        const answerText = q.options[q.answer];
        const shuffledOptions = shuffle(q.options);
        return {
          ...q,
          options: shuffledOptions,
          answer: shuffledOptions.indexOf(answerText)
        };
      });
      currentQuestion = 0;
      totalScore = 0;
      quizScreen.classList.remove("hidden");
      resultScreen.classList.add("hidden");
      showQuestion();
    }

    function showQuestion() {
      answered = false;
      const q = roundQuestions[currentQuestion];
      questionCount.textContent = `Question ${currentQuestion + 1}/${ROUND_SIZE}`;
      scoreText.textContent = `Score: ${totalScore}`;
      categoryText.textContent = q.category;
      questionText.textContent = q.question;
      progressBar.style.width = `${(currentQuestion / ROUND_SIZE) * 100}%`;
      optionsContainer.innerHTML = "";
      feedback.textContent = "";
      nextButton.disabled = true;
      nextButton.textContent = "Choose an answer";

      q.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.className = "option";
        button.textContent = `${String.fromCharCode(65 + index)}. ${option}`;
        button.addEventListener("click", () => selectAnswer(index));
        optionsContainer.appendChild(button);
      });
    }

    function selectAnswer(selectedIndex) {
      if (answered) return;
      answered = true;
      const q = roundQuestions[currentQuestion];
      const buttons = [...optionsContainer.querySelectorAll(".option")];
      buttons.forEach(button => button.disabled = true);

      if (selectedIndex === q.answer) {
        totalScore += POINTS_PER_ANSWER;
        buttons[selectedIndex].classList.add("correct");
        feedback.textContent = `✅ Correct! +${POINTS_PER_ANSWER} points. ${q.explanation}`;
      } else {
        buttons[selectedIndex].classList.add("wrong");
        buttons[q.answer].classList.add("correct");
        feedback.textContent = `❌ Not quite. The correct answer is "${q.options[q.answer]}". ${q.explanation}`;
      }

      scoreText.textContent = `Score: ${totalScore}`;
      nextButton.disabled = false;
      nextButton.textContent = currentQuestion === ROUND_SIZE - 1 ? "See Results" : "Next Question";
    }

    function showResults() {
      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");
      progressBar.style.width = "100%";
      document.getElementById("final-score").textContent = `${totalScore}/100`;

      let message;
      if (totalScore === 100) message = "Perfect score! Amazing work! 🏆";
      else if (totalScore >= 70) message = "Great job! You know your stuff! 🎉";
      else if (totalScore >= 40) message = "Nice effort! Play another round to improve.";
      else message = "Keep practising — your next round could be better!";
      document.getElementById("result-message").textContent = message;
    }

    nextButton.addEventListener("click", () => {
      if (!answered) return;
      if (currentQuestion < ROUND_SIZE - 1) {
        currentQuestion++;
        showQuestion();
      } else {
        showResults();
      }
    });

    document.getElementById("play-again").addEventListener("click", startRound);
    startRound();
  </script>
</body>
</html>
